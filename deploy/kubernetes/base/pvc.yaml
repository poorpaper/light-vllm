apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: light-vllm-models
spec:
  accessModes:
    # 单副本只需要 RWO；Pod 内仍以只读方式挂载模型。
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: light-vllm-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

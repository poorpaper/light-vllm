name: light-vllm

services:
  inference:
    image: ${LIGHT_VLLM_IMAGE:-light-vllm:dev}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${LIGHT_VLLM_VERSION:-dev}
        VCS_REF: ${LIGHT_VLLM_VCS_REF:-unknown}
    init: true
    restart: unless-stopped
    read_only: true
    ports:
      - "${LIGHT_VLLM_HTTP_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${LIGHT_VLLM_MODEL_DIR:?set LIGHT_VLLM_MODEL_DIR}
        target: /models
        read_only: true
      - light-vllm-cache:/var/cache/light-vllm
    tmpfs:
      - /tmp:size=1g,uid=10001,gid=10001,mode=1777
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --architecture
      - ${LIGHT_VLLM_ARCHITECTURE:-qwen2.5}
      - --loader
      - safetensors
      - --weights
      - /models/${LIGHT_VLLM_MODEL_NAME:-Qwen2.5-Coder-7B-Instruct}
      - --tokenizer
      - /models/${LIGHT_VLLM_MODEL_NAME:-Qwen2.5-Coder-7B-Instruct}
      - --served-model-name
      - ${LIGHT_VLLM_SERVED_MODEL_NAME:-Qwen2.5-Coder-7B-Instruct}
      - --request-timeout-seconds
      - ${LIGHT_VLLM_REQUEST_TIMEOUT_SECONDS:-300}
      - --device
      - cuda:0
      - --dtype
      - ${LIGHT_VLLM_DTYPE:-bfloat16}
      - --runtime
      - engine
      - --engine-process
      - --kv-reservation
      - blocks
      - --paged-attention-backend
      - triton
      - --max-num-sequences
      - ${LIGHT_VLLM_MAX_NUM_SEQUENCES:-16}
      - --max-num-scheduled-tokens
      - ${LIGHT_VLLM_MAX_NUM_SCHEDULED_TOKENS:-512}
      - --kv-block-size
      - ${LIGHT_VLLM_KV_BLOCK_SIZE:-16}
      - --kv-cache-memory-fraction
      - ${LIGHT_VLLM_KV_CACHE_MEMORY_FRACTION:-0.8}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()
      interval: 10s
      timeout: 3s
      start_period: 10m
      retries: 3
    stop_grace_period: 3m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  light-vllm-cache:

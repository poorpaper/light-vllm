apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: light-vllm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: light-vllm
  minReplicas: 1
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Pods
      pods:
        metric:
          name: light_vllm_queue_tokens
        target:
          type: AverageValue
          # 示例阈值；应按模型、GPU 和实测 SLO 调整。
          averageValue: "4096"

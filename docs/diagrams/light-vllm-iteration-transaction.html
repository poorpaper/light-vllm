<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>light-vllm 单轮执行事务</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36; --link: #2e5aa8; --rule: rgba(45,49,66,0.12);
      --sans: 'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --mono: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace;
    }
    body { min-height: 100vh; padding: 48px 32px; background: var(--paper); color: var(--ink); font-family: var(--sans); display: flex; justify-content: center; }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow { margin-bottom: 8px; color: var(--muted); font: 500 8px/1 var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 8px; color: var(--ink); font: 400 28px/1.15 var(--serif); letter-spacing: -0.02em; }
    .subtitle { margin-bottom: 24px; color: var(--muted); font: 400 12px/1.6 var(--sans); }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Sequence · one engine iteration · transactional boundary</p>
    <h1>一次迭代，如何成为一笔可回滚的事务</h1>
    <p class="subtitle">先预留逻辑 KV，再在锁外执行；只有输出通过校验才提交，取消与失败统一走安全释放边界。</p>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lvseq-title lvseq-desc">
      <title id="lvseq-title">light-vllm 单轮执行事务时序图</title>
      <desc id="lvseq-desc">Engine Core、Scheduler、Executor、固定 ModelSession 和请求事件流之间的单轮预留、执行、事实型多 token 输出、提交及失败回滚时序。</desc>
      <defs>
        <marker id="lvseq-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="lvseq-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="lvseq-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="lvseq-arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="none" stroke="#4f5d75" stroke-width="1"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#f5f5f5"/>

      <!-- Lifelines and transaction fragments -->
      <g stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,5">
        <line x1="120" y1="88" x2="120" y2="650"/><line x1="360" y1="88" x2="360" y2="650"/>
        <line x1="624" y1="88" x2="624" y2="650"/><line x1="888" y1="88" x2="888" y2="650"/>
        <line x1="1128" y1="88" x2="1128" y2="650"/>
      </g>
      <rect x="72" y="106" width="1104" height="224" rx="6" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <path d="M72 106 H154 L166 118 L154 130 H72 Z" fill="#2d3142"/>
      <text x="112" y="121" fill="#f5f5f5" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">EXECUTE</text>

      <rect x="72" y="346" width="1104" height="260" rx="6" fill="rgba(235,108,54,0.025)" stroke="rgba(235,108,54,0.35)" stroke-width="0.9"/>
      <path d="M72 346 H138 L150 358 L138 370 H72 Z" fill="#eb6c36"/>
      <text x="105" y="361" fill="#f5f5f5" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <line x1="72" y1="486" x2="1176" y2="486" stroke="rgba(235,108,54,0.35)" stroke-width="0.8" stroke-dasharray="5,4"/>
      <rect x="88" y="354" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="126" y="365" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">VALID OUTPUT</text>
      <rect x="88" y="494" width="104" height="16" rx="2" fill="#f5f5f5"/>
      <text x="140" y="505" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">FAILURE / CANCEL</text>

      <!-- Messages: connectors are intentionally drawn before actors -->
      <line x1="120" y1="144" x2="360" y2="144" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#lvseq-arrow-link)"/>
      <rect x="180" y="132" width="120" height="16" rx="2" fill="#f5f5f5"/><text x="240" y="143" fill="#2e5aa8" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">reserve(input + lookahead)</text>

      <line x1="360" y1="178" x2="120" y2="178" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#lvseq-arrow-open)"/>
      <rect x="176" y="166" width="128" height="16" rx="2" fill="#f5f5f5"/><text x="240" y="177" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">computed · scheduled · blocks</text>

      <path d="M120 204 h54 v30 h-54" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#lvseq-arrow)"/>
      <rect x="136" y="207" width="112" height="16" rx="2" fill="#f5f5f5"/><text x="192" y="218" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">slice input_token_ids</text>

      <line x1="120" y1="256" x2="624" y2="256" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#lvseq-arrow-accent)"/>
      <rect x="316" y="244" width="112" height="16" rx="2" fill="#f5f5f5"/><text x="372" y="255" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">acquire + execute</text>

      <line x1="624" y1="286" x2="888" y2="286" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#lvseq-arrow)"/>
      <rect x="704" y="274" width="104" height="16" rx="2" fill="#f5f5f5"/><text x="756" y="285" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">forward · session N</text>

      <line x1="888" y1="316" x2="624" y2="316" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#lvseq-arrow-open)"/>
      <rect x="704" y="304" width="104" height="16" rx="2" fill="#f5f5f5"/><text x="756" y="315" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">logits + KV writes</text>

      <line x1="624" y1="388" x2="120" y2="388" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#lvseq-arrow-open)"/>
      <rect x="280" y="376" width="184" height="16" rx="2" fill="#f5f5f5"/><text x="372" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">RequestOutput(I, O, C) · release lease</text>

      <line x1="120" y1="420" x2="360" y2="420" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#lvseq-arrow-accent)"/>
      <rect x="176" y="408" width="128" height="16" rx="2" fill="#f5f5f5"/><text x="240" y="419" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">commit(input + cached prefix)</text>

      <path d="M360 438 h48 v30 h-48" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#lvseq-arrow)"/>
      <rect x="376" y="441" width="92" height="16" rx="2" fill="#f5f5f5"/><text x="422" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">commit + trim</text>

      <line x1="120" y1="470" x2="1128" y2="470" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#lvseq-arrow-link)"/>
      <rect x="566" y="458" width="116" height="16" rx="2" fill="#f5f5f5"/><text x="624" y="469" fill="#2e5aa8" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">token / finished event</text>

      <line x1="120" y1="534" x2="624" y2="534" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#lvseq-arrow-accent)"/>
      <rect x="294" y="522" width="156" height="16" rx="2" fill="#f5f5f5"/><text x="372" y="533" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">free_request · lease retains storage</text>

      <line x1="120" y1="572" x2="360" y2="572" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#lvseq-arrow)"/>
      <rect x="174" y="560" width="132" height="16" rx="2" fill="#f5f5f5"/><text x="240" y="571" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">remove after safe boundary</text>

      <!-- Activation bars -->
      <rect x="116" y="138" width="8" height="450" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <rect x="356" y="140" width="8" height="408" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="620" y="250" width="8" height="334" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="884" y="280" width="8" height="44" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Actors -->
      <g>
        <rect x="52" y="44" width="136" height="44" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="120" y="63" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">EngineCore</text>
        <text x="120" y="77" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">orchestrator</text>
      </g>
      <g>
        <rect x="276" y="44" width="168" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="360" y="63" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Scheduler + Logical KV</text>
        <text x="360" y="77" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">policy + reservation</text>
      </g>
      <g>
        <rect x="540" y="44" width="168" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="624" y="63" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Executor + Worker</text>
        <text x="624" y="77" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">physical execution</text>
      </g>
      <g>
        <rect x="804" y="44" width="168" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="888" y="63" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">ModelSession + Attention</text>
        <text x="888" y="77" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">fixed generation + page reads</text>
      </g>
      <g>
        <rect x="1044" y="44" width="168" height="44" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.1"/>
        <text x="1128" y="63" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Request / Event Stream</text>
        <text x="1128" y="77" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">async boundary</text>
      </g>

      <line x1="72" y1="668" x2="1176" y2="668" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="72" y="692" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">普通 decode: 1 output, 0 cached output · speculative: N outputs, cached prefix ≤ reserved lookahead · no prefill/decode mode enum</text>
    </svg>
  </main>
</body>
</html>

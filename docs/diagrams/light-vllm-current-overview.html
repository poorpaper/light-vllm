  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08);
      --link: #2e5aa8;
      --rule: rgba(45,49,66,0.12);
      --sans: 'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --mono: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace;
    }
    body {
      min-height: 100vh;
      padding: 48px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      display: flex;
      justify-content: center;
    }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font: 500 8px/1 var(--mono);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 8px;
      color: var(--ink);
      font: 400 28px/1.15 var(--serif);
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin-bottom: 24px;
      color: var(--muted);
      font: 400 12px/1.6 var(--sans);
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>

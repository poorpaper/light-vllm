<!doctype html>
<html lang="zh-CN">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --link: #2e5aa8;
      --sans: "Geist", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --mono: "Geist Mono", "Cascadia Mono", monospace;
      --serif: "Instrument Serif", "Noto Serif SC", serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
    }
    .frame {
      width: min(100%, 1328px);
      margin: 0 auto;
      padding: 32px 24px 24px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--soft);
      font: 500 8px/1 var(--mono);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 8px;
      color: var(--ink);
      font: 400 28px/1.15 var(--serif);
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font: 400 12px/1.6 var(--sans);
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · current branch · engineer</p>
    <h1>light-vllm 当前架构总览</h1>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">light-vllm architecture overview</title>
  <desc id="desc">Two swimlanes show the model loading path and forward execution path. Registries select loaders and factories without feature dispatch condition trees.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 19px Inter, "Segoe UI", sans-serif; fill: #94a3b8; }
      .lane-title { font: 700 20px Inter, "Segoe UI", sans-serif; fill: #e2e8f0; letter-spacing: 1px; }
      .box-title { font: 700 18px Inter, "Segoe UI", sans-serif; fill: #ffffff; text-anchor: middle; }
      .box-note { font: 400 14px Inter, "Segoe UI", sans-serif; fill: #dbeafe; text-anchor: middle; }
      .tag { font: 700 13px Inter, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .arrow-label { font: 600 13px Inter, "Segoe UI", sans-serif; fill: #cbd5e1; text-anchor: middle; }
      .rule { font: 600 17px Inter, "Segoe UI", sans-serif; fill: #a7f3d0; text-anchor: middle; }
      .arrow { stroke: #94a3b8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1450" cy="80" r="250" fill="#2563eb" opacity="0.08"/>
  <circle cx="120" cy="820" r="280" fill="#10b981" opacity="0.06"/>

  <text x="70" y="70" class="title">light-vllm · Architecture v0.1</text>
  <text x="70" y="108" class="subtitle">Explicit contracts · Registry-based routing · Atomic model replacement</text>
  <rect x="1030" y="47" width="500" height="66" rx="18" fill="#064e3b" opacity="0.9"/>
  <text x="1280" y="87" class="rule">新增能力 = 新实现 + 注册，不修改核心分发</text>

  <rect x="55" y="145" width="1490" height="325" rx="26" fill="#0f172a" stroke="#334155" stroke-width="2" opacity="0.96"/>
  <rect x="55" y="145" width="12" height="325" rx="6" fill="#10b981"/>
  <text x="88" y="183" class="lane-title">LOAD PATH · 构造候选模型，成功后再替换</text>

  <g filter="url(#shadow)">
    <rect x="90" y="235" width="170" height="105" rx="18" fill="#0369a1"/>
    <text x="175" y="278" class="box-title">ModelSpec</text>
    <text x="175" y="306" class="box-note">architecture / loader</text>
    <text x="175" y="326" class="box-note">weights / device</text>

    <rect x="315" y="235" width="180" height="105" rx="18" fill="url(#core)"/>
    <text x="405" y="278" class="box-title">ModelRunner.load</text>
    <text x="405" y="307" class="box-note">稳定编排核心</text>

    <rect x="550" y="215" width="205" height="145" rx="18" fill="#047857"/>
    <text x="652" y="256" class="box-title">Catalog</text>
    <rect x="575" y="277" width="155" height="29" rx="14" fill="#a7f3d0"/>
    <text x="652" y="297" class="tag">Model Registry</text>
    <rect x="575" y="315" width="155" height="29" rx="14" fill="#a7f3d0"/>
    <text x="652" y="335" class="tag">Loader Registry</text>

    <rect x="810" y="215" width="215" height="145" rx="18" fill="#b45309"/>
    <text x="917" y="256" class="box-title">Resolved Components</text>
    <text x="917" y="292" class="box-note">ModelFactory</text>
    <text x="917" y="320" class="box-note">ModelLoader</text>
    <text x="917" y="344" class="box-note">自由组合</text>

    <rect x="1080" y="235" width="180" height="105" rx="18" fill="url(#model)"/>
    <text x="1170" y="278" class="box-title">Candidate</text>
    <text x="1170" y="307" class="box-note">完整加载并 eval()</text>

    <rect x="1315" y="235" width="180" height="105" rx="18" fill="#be123c"/>
    <text x="1405" y="278" class="box-title">Atomic Swap</text>
    <text x="1405" y="306" class="box-note">generation += 1</text>
  </g>

  <path d="M260 287 H305" class="arrow"/>
  <path d="M495 287 H540" class="arrow"/>
  <path d="M755 287 H800" class="arrow"/>
  <path d="M1025 287 H1070" class="arrow"/>
  <path d="M1260 287 H1305" class="arrow"/>
  <text x="1282" y="268" class="arrow-label">仅成功时</text>
  <path d="M1170 350 C1170 420 405 420 405 350" class="arrow dashed"/>
  <text x="787" y="443" class="arrow-label">加载失败：抛出异常，旧模型保持不变</text>

  <rect x="55" y="505" width="1490" height="285" rx="26" fill="#0f172a" stroke="#334155" stroke-width="2" opacity="0.96"/>
  <rect x="55" y="505" width="12" height="285" rx="6" fill="#38bdf8"/>
  <text x="88" y="543" class="lane-title">FORWARD PATH · 短锁读取模型引用，执行阶段不占用生命周期锁</text>

  <g filter="url(#shadow)">
    <rect x="120" y="610" width="190" height="105" rx="18" fill="#0369a1"/>
    <text x="215" y="653" class="box-title">ForwardBatch</text>
    <text x="215" y="682" class="box-note">input_ids [B, S]</text>

    <rect x="390" y="610" width="210" height="105" rx="18" fill="url(#core)"/>
    <text x="495" y="653" class="box-title">ModelRunner.forward</text>
    <text x="495" y="682" class="box-note">snapshot active model</text>

    <rect x="680" y="590" width="230" height="145" rx="18" fill="url(#model)"/>
    <text x="795" y="636" class="box-title">Active Model</text>
    <text x="795" y="670" class="box-note">TinyCausalLM today</text>
    <text x="795" y="698" class="box-note">any registered model later</text>

    <rect x="990" y="610" width="190" height="105" rx="18" fill="#9a3412"/>
    <text x="1085" y="653" class="box-title">ModelOutput</text>
    <text x="1085" y="682" class="box-note">logits [B, S, V]</text>

    <rect x="1270" y="590" width="220" height="145" rx="18" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="1380" y="633" class="box-title">Extension Rule</text>
    <text x="1380" y="666" class="box-note">Model / Loader 插件化</text>
    <text x="1380" y="694" class="box-note">Runner 无感知</text>
  </g>

  <path d="M310 662 H380" class="arrow"/>
  <path d="M600 662 H670" class="arrow"/>
  <path d="M910 662 H980" class="arrow"/>
  <path d="M1260 287 C1530 287 1530 560 910 625" class="arrow"/>
  <text x="1450" y="465" class="arrow-label">new active reference</text>
  <path d="M1270 662 H1190" class="arrow dashed"/>

  <rect x="55" y="825" width="1490" height="40" rx="14" fill="#1e293b"/>
  <text x="800" y="851" class="subtitle" text-anchor="middle">Current scope: loader + minimal forward · Next: request/scheduler → KV cache → execution → serving</text>
</svg>


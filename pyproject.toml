[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "light-vllm"
version = "0.1.0"
description = "A small, composable LLM inference runtime built around explicit contracts."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "poorpaper" }]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
]

[project.optional-dependencies]
serve = [
  "fastapi>=0.135",
  "uvicorn>=0.35",
]
dev = [
  "fastapi>=0.135",
  "httpx2>=2.0",
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
light-vllm-serve = "light_vllm.entrypoints.http:main"

[tool.hatch.build.targets.wheel]
packages = ["src/light_vllm"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

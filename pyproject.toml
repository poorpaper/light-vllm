[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "light-vllm"
version = "0.1.0"
description = "A small, composable LLM inference runtime built around explicit contracts."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "poorpaper" }]
dependencies = [
  "numpy>=1.26",
  "safetensors>=0.4.3",
  "torch>=2.2",
]

[project.optional-dependencies]
serve = [
  "fastapi>=0.135",
  "transformers>=4.43,<5",
  "uvicorn>=0.35",
]
dev = [
  "fastapi>=0.135",
  "httpx2>=2.0",
  "openai>=1.0",
  "pytest>=8.0",
  "ruff>=0.9",
  "transformers>=4.43,<5",
]
validation = [
  "transformers>=4.43,<5",
]
triton = [
  "torch>=2.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "triton>=3.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
light-vllm-serve = "light_vllm.entrypoints.http:main"

[tool.hatch.build.targets.wheel]
packages = ["src/light_vllm"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
